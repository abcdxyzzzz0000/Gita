version: "3.9"

services:
  db:
    image: postgres:15-alpine
    container_name: gita-db
    environment:
      POSTGRES_DB: gita_db
      POSTGRES_USER: gita_user
      POSTGRES_PASSWORD: gita_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gita_user -d gita_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: gita-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: gita-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gita-backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://gita_user:gita_password@db:5432/gita_db
      DATABASE_URL_SYNC: postgresql://gita_user:gita_password@db:5432/gita_db
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-secret-key-change-in-production}
      OLLAMA_BASE_URL: http://ollama:11434
      DEBUG: "true"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gita-celery-worker
    environment:
      DATABASE_URL: postgresql+asyncpg://gita_user:gita_password@db:5432/gita_db
      DATABASE_URL_SYNC: postgresql://gita_user:gita_password@db:5432/gita_db
      REDIS_URL: redis://redis:6379/0
      OLLAMA_BASE_URL: http://ollama:11434
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: celery -A app.celery_app worker --loglevel=info

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gita-celery-beat
    environment:
      DATABASE_URL: postgresql+asyncpg://gita_user:gita_password@db:5432/gita_db
      DATABASE_URL_SYNC: postgresql://gita_user:gita_password@db:5432/gita_db
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: celery -A app.celery_app beat --loglevel=info

volumes:
  postgres_data:
  redis_data:
  ollama_data:
